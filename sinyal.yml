name: BIST Sinyal Botu

on:
  schedule:
    # BIST islem saatleri (10:00-18:00 Turkiye saati = 07:00-15:00 UTC,
    # Turkiye yaz saati uygulamadigi icin sabit). Her saat basi 5. dakikada
    # calisir, Pazartesi-Cuma.
    - cron: "5 7-15 * * 1-5"
  workflow_dispatch: {}   # GitHub mobil uygulamasindan/elle de tetiklenebilir

permissions:
  contents: write   # state.json / signals_log.csv commit'lemek icin

jobs:
  sinyal-kontrolu:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Botu calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py

      - name: Durumu depoya geri yaz
        run: |
          git config user.name "bist-sinyal-botu"
          git config user.email "actions@github.com"
          git add state.json signals_log.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "sinyal durumu guncellendi"
          git push
